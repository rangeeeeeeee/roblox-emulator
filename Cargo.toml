[package]
name = "roblox-emulator"
version = "0.2.0"
edition = "2024"

[dependencies]
mlua = { version = "=0.12.2", features = ["luau", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"
luau0-src = "=0.22.0"

[patch.crates-io]
mlua = { path = "vendor/mlua-0.12.2" }
mlua-sys = { path = "vendor/mlua-sys-0.13.0" }

[profile.release]
opt-level = 2
