[package]
name = "roblox-emulator"
version = "0.2.2"
edition = "2024"

[dependencies]
mlua = { version = "=0.12.2", features = ["luau", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
base64 = "0.13"
lz4_flex = { version = "0.13", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
getrandom = "0.4"
aes = "0.8.4"
cbc = "0.1.2"
hmac = "0.12.1"
regex = { version = "=1.12.4", default-features = false, features = ["std", "perf-dfa", "perf-inline", "perf-literal"] }

[build-dependencies]
cc = "1"
luau0-src = "=0.22.0"

[patch.crates-io]
mlua = { path = "vendor/mlua-0.12.2" }
mlua-sys = { path = "vendor/mlua-sys-0.13.0" }
luau0-src = { path = "vendor/luau0-src-0.22.0" }

[profile.release]
opt-level = 2
